[package]
name = "snxrs-android"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "Android JNI wrapper (libsnxrs.so) around snxcore"
repository.workspace = true
publish = false

[lib]
name = "snxrs"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
snxcore = { path = "../../crates/snxcore" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
tracing = "0.1"

# The JNI entry points and the tokio runtime only exist on Android. On any other target this crate
# builds to an empty cdylib, which keeps `cargo build` on the workspace working on the host.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread"] }
ipnet = "2"
tracing-subscriber = "0.3"
android_logger = "0.14"
