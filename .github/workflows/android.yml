name: Android

on: [push, pull_request, workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-cargo-
      - name: Install Rust compiler
        run: |
          rustup update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          command -v cargo-ndk > /dev/null || cargo install cargo-ndk --locked
      - name: Clippy
        run: cargo ndk -t arm64-v8a clippy -p snxrs-android -- -D warnings
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: snx-rs-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
